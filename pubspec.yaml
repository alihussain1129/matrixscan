name: exalted
description: "Exalted - professional barcode and code scanner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  animations: ^3.0.0
  basic_utils: ^5.8.2
  camera: ^0.12.1
  camera_desktop: ^2.0.0
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
    - assets/google_fonts/