name: exalted
description: "Exalted - professional barcode and code scanner."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.13.0'

dependencies:
  camera: ^0.12.1
  cupertino_icons: ^2.0.0
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  google_fonts: ^9.0.0
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/